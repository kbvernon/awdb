[package]
name = "awdb"
version = "0.1.0"
edition = "2021"
rust-version = "1.65"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]
name = "awdb"

[[bin]]
name = "document"
path = "document.rs"

[dependencies]
extendr-api = { version = "0.9.0", features = ["serde"] }
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
